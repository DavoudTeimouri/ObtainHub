# Deprecated: superseded by .github/workflows/release.yml, which builds the
# onedir distribution, runs the smoke test and gates the release on it.
# Kept only for manual `workflow_dispatch` re-runs of the old onefile build.
name: Build Windows x64 (legacy onefile)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: python build_dist.py --exe

      - name: Debug: show generated setup.wxs
        run: |
          python tools/gen_wix_payload.py
          Write-Host "=== GENERATED SETUP.WXS ==="
          Get-Content installer/setup.wxs

      - name: Build MSI
        run: python build_dist.py --msi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ObtainHub-Windows-x64
          path: |
            dist/ohub/
            dist/ObtainHub.msi
          if-no-files-found: error
