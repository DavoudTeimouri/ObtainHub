name: Build Rust (Windows x64)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check (test + clippy)
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Add Windows target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Compile check
        run: |
          set -o pipefail
          cargo check --all-targets 2>&1 | tee check.log
        shell: bash

      - name: Run tests
        run: |
          set -o pipefail
          cargo test 2>&1 | tee test.log
        shell: bash

      # Strict again: the lint backlog is cleared, so clippy is a real gate
      # now. `cargo check --all-targets` and `cargo test` above stay hard gates.
      - name: Clippy
        run: |
          set -o pipefail
          cargo clippy --all-targets -- -D warnings 2>&1 | tee clippy.log
        shell: bash

      # Job logs are admin-only in the public API, so a failure is otherwise
      # undiagnosable without repo access. Ship the compiler output instead.
      - name: Upload check logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: |
            check.log
            test.log
            clippy.log
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build Rust Release
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          components: rust-src

      - name: Add Windows target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: |
          set -o pipefail
          cargo build --release --bin ohub 2>&1 | tee build.log
        shell: bash

      - name: Verify binary
        run: |
          ./target/release/ohub.exe --version
          ./target/release/ohub.exe --help

      - name: Stage binary artifact for installers
        uses: actions/upload-artifact@v4
        with:
          name: ohub-windows-x64
          path: target/release/ohub.exe
          if-no-files-found: error
          retention-days: 5

      # Job logs are admin-only in the public API, so a failure is otherwise
      # undiagnosable without repo access. Ship the compiler output instead.
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

  installer-msi:
    name: Build MSI Installer (WiX v3)
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: ohub-windows-x64
          path: target/release

      - name: Copy binary to installer dir
        run: |
          Copy-Item target/release/ohub.exe installer/ohub.exe

      - name: Verify icon exists
        run: |
          Write-Host "Icon exists: $(Test-Path installer/icon.ico)"
          Write-Host "Icon full path: $(Resolve-Path installer/icon.ico)"

      - name: Install WiX Toolset v3
        shell: powershell
        run: |
          choco install wixtoolset -y --no-progress
          Write-Host "WiX installed"

      - name: Build WiX MSI
        shell: powershell
        run: |
          Write-Host "=== WiX MSI Build ==="
          $wixBin = $null
          $wixPaths = @(
            "C:\Program Files (x86)\WiX Toolset v3.14\bin",
            "C:\Program Files\WiX Toolset v3.14\bin"
          )
          foreach ($p in $wixPaths) {
            $resolved = Get-Item -Path $p -ErrorAction SilentlyContinue
            if ($resolved -and (Test-Path (Join-Path $resolved.FullName "candle.exe"))) {
              $wixBin = $resolved.FullName
              Write-Host "Found WiX at: $wixBin"
              break
            }
          }
          if (-not $wixBin) {
            $candlePath = Get-Command candle.exe -ErrorAction SilentlyContinue
            if ($candlePath) { $wixBin = Split-Path $candlePath }
          }
          if (-not $wixBin) {
            Write-Host "WiX NOT FOUND - skipping MSI"
            exit 0
          }
          $candle = Join-Path $wixBin "candle.exe"
          $light = Join-Path $wixBin "light.exe"
          Write-Host "candle: $candle (exists: $(Test-Path $candle))"
          Write-Host "light:  $light  (exists: $(Test-Path $light))"
          & $candle -out ObtainHub.wixobj installer/setup.wxs 2>&1
          Write-Host "candle exit: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $light -out ObtainHub.msi ObtainHub.wixobj 2>&1
          Write-Host "light exit: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "MSI: $(Get-Item ObtainHub.msi)"

      - name: Stage MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ObtainHub-MSI
          path: ObtainHub.msi
          if-no-files-found: error
          retention-days: 5

  installer-nsis:
    name: Build NSIS EXE Installer
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: ohub-windows-x64
          path: target/release

      - name: Copy binary to installer dir
        run: |
          Copy-Item target/release/ohub.exe installer/ohub.exe

      - name: Verify icon exists
        run: |
          Write-Host "Icon exists: $(Test-Path installer/icon.ico)"
          Write-Host "Icon full path: $(Resolve-Path installer/icon.ico)"

      - name: Copy icon to current dir for NSIS
        run: |
          Copy-Item installer/icon.ico icon.ico

      - name: Install NSIS
        shell: powershell
        run: |
          # Pinned to 3.11 on purpose. NSIS 3.13 produces "Invalid opcode" installers.
          # SourceForge is unreliable (returns HTML error pages instead of binaries).
          # Use GitHub releases + winget + choco as reliable sources.
          #
          $nsisVersions = @("3.11", "3.10.1")
          $installed = $false

          # 1. Try winget first (built into Windows images)
          foreach ($v in $nsisVersions) {
            Write-Host "Trying winget NSIS $v..."
            $result = winget install NSIS.NSIS --version $v --accept-source-agreements --accept-package-agreements --silent 2>&1
            if ($LASTEXITCODE -eq 0 -or ($result -match "already installed")) {
              $installed = $true
              break
            }
            Write-Host "winget NSIS $v failed or not available"
          }

          # 2. Try Chocolatey
          if (-not $installed) {
            foreach ($v in $nsisVersions) {
              Write-Host "Trying Chocolatey NSIS $v..."
              choco install nsis --version=$v -y --no-progress --allow-downgrade 2>&1
              if ($LASTEXITCODE -eq 0) {
                $installed = $true
                break
              }
              Write-Host "Chocolatey NSIS $v failed"
            }
          }

          # 3. Direct download from GitHub releases (more reliable than SourceForge)
          if (-not $installed) {
            Write-Host "Package managers failed, trying GitHub releases download..."
            $urls = @()
            foreach ($v in $nsisVersions) {
              $urls += "https://github.com/nsis-maint/nsis/releases/download/nsis-$v/nsis-$v-setup.exe"
            }

            $installerPath = "$env:TEMP\nsic-setup.exe"
            $downloaded = $false
            foreach ($url in $urls) {
              try {
                Write-Host "Trying: $url"
                Invoke-WebRequest -Uri $url -OutFile $installerPath -UseBasicParsing -TimeoutSec 120
                if (Test-Path $installerPath -PathType Leaf) {
                  $size = (Get-Item $installerPath).Length
                  Write-Host "Downloaded $size bytes"
                  if ($size -gt 2000000) {
                    $downloaded = $true
                    break
                  }
                }
              } catch {
                Write-Host "Failed: $($_.Exception.Message)"
              }
            }

            if (-not $downloaded) {
              Write-Host "All NSIS download attempts failed"
              exit 1
            }

            & $installerPath /S
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Direct download install failed: $LASTEXITCODE"
              exit $LASTEXITCODE
            }
            $installed = $true
          }

          $makensisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensisPath)) {
            $makensisPath = "C:\Program Files\NSIS\makensis.exe"
          }
          if (-not (Test-Path $makensisPath)) {
            Write-Host "makensis NOT FOUND"
            exit 1
          }

          # Fail the build if the pin silently drifted.
          $version = (& $makensisPath -VERSION 2>&1) -join ""
          Write-Host "makensis at: $makensisPath (version $version)"
          if ($version -notmatch "3\.(10\.1|11)") {
            Write-Host "::error::Expected NSIS 3.10.1 or 3.11, got: $version"
            exit 1
          }
          Add-Content -Path $env:GITHUB_ENV -Value "MAKENSIS_PATH=$makensisPath"

      - name: Build NSIS EXE installer
        shell: powershell
        run: |
          Write-Host "=== NSIS EXE Build ==="
          $makensisPath = $env:MAKENSIS_PATH
          if (-not $makensisPath -or -not (Test-Path $makensisPath)) {
            Write-Host "makensis NOT FOUND at '$makensisPath'"
            exit 1
          }
          Write-Host "makensis: $makensisPath"
          # Verify binary exists before building
          if (-not (Test-Path "installer/ohub.exe")) {
            Write-Host "installer/ohub.exe NOT FOUND - copying from target/release"
            Copy-Item target/release/ohub.exe installer/ohub.exe
          }
          Write-Host "Binary for installer: $(Get-Item installer/ohub.exe)"
          & $makensisPath installer/ObtainHub.nsi 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Host "makensis failed: $LASTEXITCODE"; exit $LASTEXITCODE }
          if (-not (Test-Path "installer/ObtainHub-Setup.exe")) {
            Write-Host "installer/ObtainHub-Setup.exe NOT FOUND"
            exit 1
          }
          Write-Host "EXE installer: $(Get-Item installer/ObtainHub-Setup.exe)"

      - name: Stage EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ObtainHub-EXE
          path: installer/ObtainHub-Setup.exe
          if-no-files-found: error
          retention-days: 5

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, installer-msi, installer-nsis]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      # Needed for CHANGELOG.md; the previous version had no checkout, so the
      # extraction step ran against an empty workspace.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: ObtainHub-MSI
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: ObtainHub-EXE
          path: dist

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd dist
          sha256sum ObtainHub.msi ObtainHub-Setup.exe > SHA256SUMS
          cat SHA256SUMS

      - name: Extract changelog for this tag
        shell: bash
        run: |
          # Each release body must be its own `## [vX.Y.Z]` section from
          # CHANGELOG.md — not GitHub's auto-generated commit list.
          # index(), not regex: `/^## \[/` inside a single-quoted awk program is
          # parsed as an escaped backslash followed by an unterminated character
          # class, which is what failed the previous runs.
          SECTION="$(awk -v tag="${GITHUB_REF_NAME}" '
            index($0, "## [" tag "]") == 1 { found=1 }
            found && index($0, "## [") == 1 && index($0, "## [" tag "]") != 1 { exit }
            found { print }
          ' CHANGELOG.md)"
          if [ -z "$SECTION" ]; then
            echo "::error::No '## [${GITHUB_REF_NAME}]' section in CHANGELOG.md"
            exit 1
          fi
          printf '%s\n' "$SECTION" > RELEASE_NOTES.md
          echo "Release notes:"
          cat RELEASE_NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/ObtainHub.msi
            dist/ObtainHub-Setup.exe
            dist/SHA256SUMS
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}