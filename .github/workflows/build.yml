# Deprecated: superseded by .github/workflows/release.yml, which builds the
# onedir distribution, runs the smoke test and gates the release on it.
# Kept only for manual `workflow_dispatch` re-runs of the old onefile build.
name: Build Windows x64 (legacy onefile)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build Legacy onefile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build PyInstaller onedir + PE hardening
        run: python build_dist.py --exe

      - name: Generate WiX payload from the onedir build
        shell: powershell
        run: |
          python tools/gen_wix_payload.py
          Select-String -Path installer\setup.wxs -Pattern 'GENERATED PAYLOAD' -Context 0,3

      - name: Install WiX Toolset
        shell: powershell
        run: |
          choco install wixtoolset -y --no-progress
          Write-Host "WiX installed"

      - name: Build WiX MSI
        shell: powershell
        run: |
          Write-Host "=== WiX MSI Build ==="
          $wixBin = $null
          $wixPaths = @(
            "C:\Program Files (x86)\WiX Toolset v3.11\bin",
            "C:\Program Files\WiX Toolset v3.11\bin",
            "C:\Program Files (x86)\WiX Toolset v4.0\bin",
            "C:\Program Files\WiX Toolset v4.0\bin"
          )
          foreach ($p in $wixPaths) {
            $resolved = Get-Item -Path $p -ErrorAction SilentlyContinue
            if ($resolved -and (Test-Path (Join-Path $resolved.FullName "candle.exe"))) {
              $wixBin = $resolved.FullName
              Write-Host "Found WiX at: $wixBin"
              break
            }
          }
          if (-not $wixBin) {
            $candlePath = Get-Command candle.exe -ErrorAction SilentlyContinue
            if ($candlePath) { $wixBin = Split-Path $candlePath }
          }
          if (-not $wixBin) {
            Write-Host "WiX NOT FOUND - skipping MSI"
            exit 0
          }
          $candle = Join-Path $wixBin "candle.exe"
          $light = Join-Path $wixBin "light.exe"
          Write-Host "candle: $candle (exists: $(Test-Path $candle))"
          Write-Host "light:  $light  (exists: $(Test-Path $light))"
          & $candle -out dist/ObtainHub.wixobj installer/setup.wxs 2>&1
          Write-Host "candle exit: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $light -out dist/ObtainHub.msi dist/ObtainHub.wixobj 2>&1
          Write-Host "light exit: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "MSI: $(Get-Item dist/ObtainHub.msi)"

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          Write-Host "Inno Setup installed"
          $isccFiles = Get-ChildItem "C:\ProgramData\chocolatey\lib\innosetup" -Recurse -Filter "ISCC.exe" -ErrorAction SilentlyContinue
          if ($isccFiles) { 
            Write-Host "Found ISCC in chocolatey: $($isccFiles[0].FullName)"
            $isccPath = $isccFiles[0].FullName
          } else {
            $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $isccPath)) {
              $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
            }
          }
          Write-Host "ISCC_PATH=$isccPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Inno Setup EXE installer
        shell: powershell
        run: |
          $isccPath = $env:ISCC_PATH
          if (-not $isccPath -or -not (Test-Path $isccPath)) {
            Write-Host "ISCC NOT FOUND at $isccPath"
            exit 1
          }
          Write-Host "ISCC: $isccPath"
          & $isccPath installer/setup.iss 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Host "ISCC failed: $LASTEXITCODE"; exit $LASTEXITCODE }
          if (-not (Test-Path "installer/Output/ObtainHub-Setup.exe")) {
            Write-Host "Output/ObtainHub-Setup.exe NOT FOUND"
            exit 1
          }
          Write-Host "EXE installer: $(Get-Item installer/Output/ObtainHub-Setup.exe)"

      - name: Stage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ObtainHub-Windows-x64
          path: |
            dist/ohub/
            dist/ObtainHub.msi
          if-no-files-found: error
          retention-days: 5
