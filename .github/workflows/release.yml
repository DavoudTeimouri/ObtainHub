name: Build and Release Windows Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          choco install innosetup wixtoolset -y
          # Verify WiX installation
          Write-Host "=== Verifying WiX Installation ==="
          $wixPaths = @(
            "C:\Program Files (x86)\WiX Toolset v3.11\bin",
            "C:\Program Files\WiX Toolset v3.11\bin"
          )
          foreach ($path in $wixPaths) {
            if (Test-Path $path) {
              Write-Host "Found WiX at: $path"
              Get-ChildItem $path
            }
          }
          $candlePath = Get-Command candle.exe -ErrorAction SilentlyContinue
          if ($candlePath) {
            Write-Host "Found candle.exe in PATH: $candlePath"
          } else {
            Write-Host "candle.exe NOT in PATH"
          }

      - name: Build with PyInstaller
        shell: powershell
        run: |
          python -m PyInstaller --onefile --name ohub --clean obtainhub/main.py
          Write-Host "=== PyInstaller Output ==="
          Get-ChildItem dist\
          Get-ChildItem dist\ -Recurse -Filter "*.exe"

      - name: Find WiX tools
        shell: powershell
        run: |
          Write-Host "=== Find WiX Tools Debug ==="
          $wixPath = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -Directory | Select-Object -First 1
          if ($wixPath) {
            Write-Host "Found WiX Toolset at: $($wixPath.FullName)"
            $binPath = Join-Path $wixPath.FullName "bin"
            if (Test-Path $binPath) {
              Write-Host "Found bin at: $binPath"
              $candle = Join-Path $binPath "candle.exe"
              $light = Join-Path $binPath "light.exe"
              Write-Host "candle.exe: $(Test-Path $candle)"
              Write-Host "light.exe: $(Test-Path $light)"
              echo "WIX_BIN=$binPath" >> $env:GITHUB_ENV
              Write-Host "Set WIX_BIN to: $binPath"
            } else {
              Write-Host "bin directory NOT FOUND"
            }
          } else {
            Write-Host "WiX Toolset NOT FOUND in C:\Program Files (x86)"
            # Try other locations
            $wixPath64 = Get-ChildItem "C:\Program Files\WiX Toolset*" -Directory | Select-Object -First 1
            if ($wixPath64) {
              Write-Host "Found WiX Toolset at: $($wixPath64.FullName)"
              $binPath = Join-Path $wixPath64.FullName "bin"
              if (Test-Path $binPath) {
                Write-Host "Found bin at: $binPath"
                echo "WIX_BIN=$binPath" >> $env:GITHUB_ENV
                Write-Host "Set WIX_BIN to: $binPath"
              }
            }
          }

      - name: Find Inno Setup
        shell: powershell
        run: |
          Write-Host "=== Find Inno Setup Debug ==="
          $isccPath = Get-Command iscc -ErrorAction SilentlyContinue
          if ($isccPath) {
            Write-Host "Found iscc in PATH: $isccPath"
          } else {
            Write-Host "iscc not in PATH, checking default locations..."
            $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (Test-Path $isccPath) {
              Write-Host "Found at default x86 location: $isccPath"
            } else {
              $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
              if (Test-Path $isccPath) {
                Write-Host "Found at default x64 location: $isccPath"
              } else {
                Write-Host "ISCC NOT FOUND in any default location!"
                $isccPath = $null
              }
            }
          }
          if ($isccPath) {
            echo "ISCC_PATH=$isccPath" >> $env:GITHUB_ENV
            Write-Host "Set ISCC_PATH to: $isccPath"
          } else {
            Write-Host "ERROR: ISCC_PATH not set!"
            exit 1
          }
          # Verify the env var is set for next steps
          Write-Host "GITHUB_ENV ISCC_PATH: $env:ISCC_PATH"

      - name: Build WiX MSI
        shell: powershell
        run: |
          Write-Host "=== WiX MSI Build Debug ==="
          # Try to find WiX on the system
          $wixPaths = @(
            "C:\Program Files (x86)\WiX Toolset v3.11\bin",
            "C:\Program Files\WiX Toolset v3.11\bin",
            "C:\Program Files (x86)\WiX Toolset*\bin",
            "C:\Program Files\WiX Toolset*\bin"
          )
          $wixBin = $null
          foreach ($path in $wixPaths) {
            $resolved = Get-ChildItem $path -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($resolved -and (Test-Path (Join-Path $resolved.FullName "candle.exe"))) {
              $wixBin = $resolved.FullName
              Write-Host "Found WiX at: $wixBin"
              break
            }
          }
          if (-not $wixBin) {
            # Try to find candle.exe directly
            $candlePath = Get-Command candle.exe -ErrorAction SilentlyContinue
            if ($candlePath) {
              $wixBin = Split-Path $candlePath
              Write-Host "Found candle.exe at: $candlePath, using dir: $wixBin"
            }
          }
          if ($wixBin) {
            Write-Host "Using WiX bin: $wixBin"
            $candle = Join-Path $wixBin "candle.exe"
            $light = Join-Path $wixBin "light.exe"
            Write-Host "candle: $candle (exists: $(Test-Path $candle))"
            Write-Host "light: $light (exists: $(Test-Path $light))"
            Write-Host "setup.wxs: $(Test-Path installer\setup.wxs)"
            Write-Host "ohub.exe: $(Test-Path dist\ohub.exe)"
            & $candle -out dist/ObtainHub.wixobj installer/setup.wxs
            & $light -out dist/ObtainHub.msi dist/ObtainHub.wixobj
            Write-Host "MSI created: $(Test-Path dist/ObtainHub.msi)"
            Get-ChildItem dist/
          } else {
            Write-Host "WiX Toolset NOT FOUND anywhere on system!"
            exit 1
          }

      - name: Build Inno Setup EXE
        shell: powershell
        working-directory: installer
        run: |
          Write-Host "=== Inno Setup Build Debug ==="
          Write-Host "Current directory: $(Get-Location)"
          Write-Host "ISCC_PATH from env: $env:ISCC_PATH"
          
          # Check if ISCC_PATH is available, if not try to find it
          if (-not $env:ISCC_PATH) {
            Write-Host "ISCC_PATH not set in env, searching..."
            $isccPath = Get-Command iscc -ErrorAction SilentlyContinue
            if ($isccPath) {
              Write-Host "Found iscc in PATH: $isccPath"
              $env:ISCC_PATH = $isccPath
            } else {
              $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
              if (Test-Path $isccPath) {
                Write-Host "Found at default x86 location: $isccPath"
                $env:ISCC_PATH = $isccPath
              } else {
                $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
                if (Test-Path $isccPath) {
                  Write-Host "Found at default x64 location: $isccPath"
                  $env:ISCC_PATH = $isccPath
                } else {
                  Write-Host "ISCC NOT FOUND in any default location!"
                  exit 1
                }
              }
            }
          }
          
          Write-Host "ISCC_PATH resolved to: $env:ISCC_PATH"
          Write-Host "ISCC exists: $(Test-Path $env:ISCC_PATH)"
          
          # Check if ohub.exe exists
          $ohubPath = "..\dist\ohub.exe"
          Write-Host "Looking for ohub.exe at: $ohubPath"
          if (Test-Path $ohubPath) {
            Write-Host "ohub.exe FOUND"
            Get-ChildItem ..\dist\
          } else {
            Write-Host "ohub.exe NOT FOUND"
            Get-ChildItem ..\ -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue
            exit 1
          }
          
          Write-Host "Running ISCC: $env:ISCC_PATH setup.iss"
          try {
            $process = Start-Process -FilePath $env:ISCC_PATH -ArgumentList "setup.iss" -Wait -PassThru -RedirectStandardOutput "stdout.txt" -RedirectStandardError "stderr.txt"
            $exitCode = $process.ExitCode
            $stdout = Get-Content "stdout.txt" -Raw -ErrorAction SilentlyContinue
            $stderr = Get-Content "stderr.txt" -Raw -ErrorAction SilentlyContinue
            Write-Host "ISCC exit code: $exitCode"
            if ($stdout) { Write-Host "ISCC stdout: $stdout" }
            if ($stderr) { Write-Host "ISCC stderr: $stderr" }
            if ($exitCode -ne 0) {
              Write-Host "Inno Setup FAILED with exit code $exitCode"
              exit $exitCode
            }
          } catch {
            Write-Host "Exception running ISCC: $_"
            exit 1
          }
          
          # Verify output
          if (Test-Path "Output\ObtainHub-Setup.exe") {
            Write-Host "Inno Setup output FOUND at: installer\Output\ObtainHub-Setup.exe"
            Get-ChildItem Output\
          } else {
            Write-Host "Inno Setup output NOT FOUND in installer\Output!"
            Get-ChildItem . -Recurse -Filter "*.exe" | Where-Object {$_.Name -like "*Setup*"}
            Get-ChildItem ..\dist -Filter "*.exe" -ErrorAction SilentlyContinue
            Get-ChildItem . -Recurse -Filter "*.exe"
            exit 1
          }

      - name: Copy Inno Setup output to root dist
        shell: powershell
        run: |
          if (Test-Path "installer\Output\ObtainHub-Setup.exe") {
            Copy-Item "installer\Output\ObtainHub-Setup.exe" "dist\ObtainHub-Setup.exe" -Force
            Write-Host "Copied to dist\ObtainHub-Setup.exe"
          } elseif (Test-Path "dist\ObtainHub-Setup.exe") {
            Write-Host "Found at dist\ObtainHub-Setup.exe (already in root)"
          } else {
            Write-Host "Source not found: installer\Output\ObtainHub-Setup.exe"
            Get-ChildItem . -Recurse -Filter "*.exe" | Where-Object {$_.Name -like "*Setup*"}
          }

      - name: List dist directory
        shell: powershell
        run: |
          Get-ChildItem dist\

      - name: Create/Update Release and Upload Assets
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "${{ github.ref_name }}"
          $prerelease = $tag -match 'beta|alpha'
          
          Write-Host "Tag: $tag"
          Write-Host "Prerelease: $prerelease"
          
          # Check if release exists
          $existingRelease = gh release view $tag --json id --jq .id 2>$null
          if ($existingRelease) {
            Write-Host "Deleting existing release: $existingRelease"
            gh release delete $tag --yes --cleanup-tag
          }
          
          # Create new release
          Write-Host "Creating release..."
          $releaseArgs = @("release", "create", $tag, "--title", "Release $tag", "--generate-notes")
          if ($prerelease) { $releaseArgs += "--prerelease" }
          $result = gh $releaseArgs 2>&1
          Write-Host "Release create result: $result"
          
          # Upload assets - ONLY MSI and Setup EXE (no standalone ohub.exe)
          $assets = @(
            "dist/ObtainHub.msi",
            "dist/ObtainHub-Setup.exe"
          )
          
          foreach ($asset in $assets) {
            if (Test-Path $asset) {
              Write-Host "Uploading $asset..."
              gh release upload $tag $asset --clobber
            }
            else {
              Write-Host "Asset not found: $asset"
            }
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}