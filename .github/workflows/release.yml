name: Build and Release Windows Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --onefile --name ohub --clean obtainhub/main.py
          Write-Host "PyInstaller completed"
          Get-ChildItem dist\

      - name: Build WiX MSI
        shell: powershell
        run: |
          Write-Host "=== WiX MSI Build Debug ==="
          # Try to find WiX on the system
          $wixPaths = @(
            "C:\Program Files (x86)\WiX Toolset v3.11\bin",
            "C:\Program Files\WiX Toolset v3.11\bin",
            "C:\Program Files (x86)\WiX Toolset v4.0\bin",
            "C:\Program Files\WiX Toolset v4.0\bin",
            "C:\Program Files (x86)\WiX Toolset*\bin",
            "C:\Program Files\WiX Toolset*\bin"
          )
          $wixBin = $null
          foreach ($path in $wixPaths) {
            $resolved = Get-ChildItem $path -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($resolved -and (Test-Path (Join-Path $resolved.FullName "candle.exe"))) {
              $wixBin = $resolved.FullName
              Write-Host "Found WiX at: $wixBin"
              break
            }
          }
          if (-not $wixBin) {
            $candlePath = Get-Command candle.exe -ErrorAction SilentlyContinue
            if ($candlePath) {
              $wixBin = Split-Path $candlePath
              Write-Host "Found candle.exe at: $candlePath, using dir: $wixBin"
            }
          }
          if ($wixBin) {
            Write-Host "Using WiX bin: $wixBin"
            $candle = Join-Path $wixBin "candle.exe"
            $light = Join-Path $wixBin "light.exe"
            Write-Host "candle: $candle (exists: $(Test-Path $candle))"
            Write-Host "light: $light (exists: $(Test-Path $light))"
            Write-Host "setup.wxs: $(Test-Path installer\setup.wxs)"
            Write-Host "ohub.exe: $(Test-Path dist\ohub.exe)"
            Write-Host "Running candle..."
            & $candle -out dist/ObtainHub.wixobj installer/setup.wxs 2>&1
            Write-Host "candle exit code: $LASTEXITCODE"
            Write-Host "Running light..."
            & $light -out dist/ObtainHub.msi dist/ObtainHub.wixobj 2>&1
            Write-Host "light exit code: $LASTEXITCODE"
            Write-Host "MSI created: $(Test-Path dist/ObtainHub.msi)"
            Get-ChildItem dist/
          } else {
            Write-Host "WiX Toolset NOT FOUND anywhere on system - skipping MSI build"
            Get-ChildItem "C:\Program Files (x86)" -Filter "*WiX*" -ErrorAction SilentlyContinue
            Get-ChildItem "C:\Program Files" -Filter "*WiX*" -ErrorAction SilentlyContinue
            Get-ChildItem "C:\ProgramData\chocolatey\lib" -Filter "*wix*" -ErrorAction SilentlyContinue | ForEach-Object { Get-ChildItem $_.FullName -Recurse -Filter "candle.exe" -ErrorAction SilentlyContinue }
          }
          exit 0

      - name: Install Inno Setup
        shell: powershell
        run: |
          Write-Host "=== Installing Inno Setup via direct download ==="
          $isccUrl = "https://files.jrsoftware.org/is/6/innosetup-6.2.2.exe"
          $installerPath = "$env:TEMP\is.exe"
          Invoke-WebRequest -Uri $isccUrl -OutFile $installerPath -UseBasicParsing
          Write-Host "Downloaded Inno Setup installer to $installerPath"
          
          # Silent install
          & $installerPath /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="C:\Program Files (x86)\Inno Setup 6"
          Write-Host "Inno Setup installed"
          
          # Verify installation
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $isccPath) {
            Write-Host "ISCC found at: $isccPath"
          } else {
            Write-Host "ISCC NOT FOUND at expected location!"
            Get-ChildItem "C:\Program Files (x86)\Inno Setup 6" -Recurse -ErrorAction SilentlyContinue
            exit 1
          }
          
          # Also check if it's in PATH
          $pathIscc = Get-Command iscc -ErrorAction SilentlyContinue
          if ($pathIscc) {
            Write-Host "ISCC also in PATH: $pathIscc"
          }

      - name: Build Inno Setup EXE
        shell: powershell
        working-directory: installer
        run: |
          Write-Host "=== Inno Setup Build Debug ==="
          Write-Host "Current directory: $(Get-Location)"
          Write-Host "PWD: $(pwd)"
          Write-Host "Files in installer: $(Get-ChildItem)"
          
          # Find ISCC - setup-innosetup adds it to PATH
          $isccPath = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $isccPath) {
            # Fallback to default paths
            $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $isccPath)) {
              $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
            }
          }
          
          if (-not $isccPath -or -not (Test-Path $isccPath)) {
            Write-Host "ISCC NOT FOUND in any common location!"
            Write-Host "Checking if iscc is in PATH:"
            Get-Command iscc -ErrorAction SilentlyContinue
            exit 1
          }
          
          Write-Host "ISCC_PATH resolved to: $isccPath"
          Write-Host "ISCC exists: $(Test-Path $isccPath)"
          
          $ohubPath = "..\dist\ohub.exe"
          Write-Host "Looking for ohub.exe at: $ohubPath"
          if (Test-Path $ohubPath) {
            Write-Host "ohub.exe FOUND"
            Get-ChildItem ..\dist\
          } else {
            Write-Host "ohub.exe NOT FOUND"
            Get-ChildItem ..\ -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue
            exit 1
          }
          
          Write-Host "Checking setup.iss exists: $(Test-Path setup.iss)"
          Write-Host "Running ISCC: $isccPath setup.iss"
          Write-Host "=== ISCC COMPILATION OUTPUT START ==="
          & $isccPath setup.iss 2>&1 | Tee-Object -FilePath iscc_output.txt
          $exitCode = ${PIPESTATUS}[0]
          Write-Host "=== ISCC COMPILATION OUTPUT END ==="
          Write-Host "ISCC exit code: $exitCode"
          if ($exitCode -ne 0) {
            Write-Host "Inno Setup FAILED with exit code $exitCode"
            exit $exitCode
          }
          
          Write-Host "=== Checking Output directory ==="
          if (Test-Path "Output") {
            Get-ChildItem Output\
          } else {
            Write-Host "Output directory does NOT exist"
          }
          
          $outputPaths = @(
            "Output\ObtainHub-Setup.exe",
            "..\dist\ObtainHub-Setup.exe",
            ".\ObtainHub-Setup.exe"
          )
          $found = $false
          foreach ($p in $outputPaths) {
            if (Test-Path $p) {
              Write-Host "Inno Setup output FOUND at: $p"
              Get-ChildItem $p
              $found = $true
              break
            }
          }
          if (-not $found) {
            Write-Host "Inno Setup output NOT FOUND in any expected location!"
            Get-ChildItem . -Recurse -Filter "*.exe" | Where-Object {$_.Name -like "*Setup*"}
            Get-ChildItem ..\dist -Filter "*.exe" -ErrorAction SilentlyContinue
            Get-ChildItem . -Recurse -Filter "*.exe"
            exit 1
          }
          exit 0

      - name: Upload ISCC output for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iscc-output
          path: installer/iscc_output.txt
          retention-days: 5

      - name: Copy Inno Setup output to root dist
        shell: powershell
        run: |
          Write-Host "=== Checking installer/Output ==="
          Get-ChildItem installer\Output\ -ErrorAction SilentlyContinue
          Write-Host "=== Checking dist before copy ==="
          Get-ChildItem dist\
          if (Test-Path "installer\Output\ObtainHub-Setup.exe") {
            Copy-Item "installer\Output\ObtainHub-Setup.exe" "dist\ObtainHub-Setup.exe" -Force
            Write-Host "Copied to dist\ObtainHub-Setup.exe"
          } elseif (Test-Path "dist\ObtainHub-Setup.exe") {
            Write-Host "Found at dist\ObtainHub-Setup.exe (already in root)"
          } else {
            Write-Host "Source not found: installer\Output\ObtainHub-Setup.exe"
            Get-ChildItem . -Recurse -Filter "*.exe" | Where-Object {$_.Name -like "*Setup*"}
          }
          Get-ChildItem dist\

      - name: Upload Inno Setup EXE artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: innosetup-output
          path: dist/ObtainHub-Setup.exe
          retention-days: 5

      - name: List dist directory
        shell: powershell
        run: |
          Write-Host "=== Final dist directory listing ==="
          Get-ChildItem dist\

      - name: Verify asset exists
        shell: powershell
        run: |
          if (Test-Path "dist\ObtainHub-Setup.exe") {
            Write-Host "ObtainHub-Setup.exe EXISTS in dist"
            Get-ChildItem dist\ObtainHub-Setup.exe
          } else {
            Write-Host "ObtainHub-Setup.exe NOT FOUND in dist"
          }
          if (Test-Path "dist\ObtainHub.msi") {
            Write-Host "ObtainHub.msi EXISTS in dist"
            Get-ChildItem dist\ObtainHub.msi
          } else {
            Write-Host "ObtainHub.msi NOT FOUND in dist"
          }

      - name: Create/Update Release and Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          Write-Host "Tag: $tag"
          
          # Determine if prerelease
          $prerelease = $tag -match 'beta|alpha|rc'
          Write-Host "Prerelease: $prerelease"
          
          # List what's in dist before upload
          Write-Host "=== Assets in dist before upload ==="
          Get-ChildItem dist\
          
          # Delete existing release if it exists
          $existingRelease = gh release view $tag --json id --jq .id 2>$null
          if ($existingRelease) {
            Write-Host "Deleting existing release: $existingRelease"
            gh release delete $tag --yes --cleanup-tag
          }
          
          # Create new release
          Write-Host "Creating release..."
          $releaseArgs = @("release", "create", $tag, "--title", "Release $tag", "--generate-notes")
          if ($prerelease) { $releaseArgs += "--prerelease" }
          $result = gh $releaseArgs 2>&1
          Write-Host "Release create result: $result"
          
          # Upload assets - ONLY MSI and Setup EXE (no standalone ohub.exe)
          $assets = @(
            "dist/ObtainHub.msi",
            "dist/ObtainHub-Setup.exe"
          )
          
          foreach ($asset in $assets) {
            if (Test-Path $asset) {
              Write-Host "Uploading $asset..."
              gh release upload $tag $asset --clobber
            }
            else {
              Write-Host "Asset NOT FOUND: $asset"
              Write-Host "Current dist contents:"
              Get-ChildItem dist\
            }
          }