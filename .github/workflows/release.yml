name: Build and Release Windows Binaries

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  typecheck:
    name: Type Check (mypy)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run mypy
        run: mypy obtainhub/ --ignore-missing-imports

  security-audit:
    name: Security Audit (pip-audit)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit
      - name: pip-audit
        run: pip-audit -r requirements.txt --format json --output pip-audit-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-results
          path: pip-audit-results.json
          retention-days: 30

  build:
    name: Build Artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Sync version into installer/manifest files
        run: python tools/sync_versions.py

      - name: Build with PyInstaller (onedir) and harden PE headers
        run: |
          python build_dist.py --exe
          Write-Host "PyInstaller completed"
          Get-ChildItem dist\ohub\

      - name: Generate WiX payload from the onedir build
        shell: powershell
        run: |
          python tools/gen_wix_payload.py
          Select-String -Path installer\setup.wxs -Pattern 'GENERATED PAYLOAD' -Context 0,3

      - name: Install WiX Toolset
        shell: powershell
        run: |
          choco install wixtoolset -y --no-progress
          Write-Host "WiX installed"

      - name: Build WiX MSI
        shell: powershell
        run: |
          Write-Host "=== WiX MSI Build ==="
          $wixBin = $null
          $wixPaths = @(
            "C:\Program Files (x86)\WiX Toolset v3.11\bin",
            "C:\Program Files\WiX Toolset v3.11\bin",
            "C:\Program Files (x86)\WiX Toolset v4.0\bin",
            "C:\Program Files\WiX Toolset v4.0\bin"
          )
          foreach ($p in $wixPaths) {
            $resolved = Get-Item -Path $p -ErrorAction SilentlyContinue
            if ($resolved -and (Test-Path (Join-Path $resolved.FullName "candle.exe"))) {
              $wixBin = $resolved.FullName
              Write-Host "Found WiX at: $wixBin"
              break
            }
          }
          if (-not $wixBin) {
            $candlePath = Get-Command candle.exe -ErrorAction SilentlyContinue
            if ($candlePath) { $wixBin = Split-Path $candlePath }
          }
          if (-not $wixBin) {
            Write-Host "WiX NOT FOUND - skipping MSI"
            exit 0
          }
          $candle = Join-Path $wixBin "candle.exe"
          $light = Join-Path $wixBin "light.exe"
          Write-Host "candle: $candle (exists: $(Test-Path $candle))"
          Write-Host "light:  $light  (exists: $(Test-Path $light))"
          & $candle -out dist/ObtainHub.wixobj installer/setup.wxs 2>&1
          Write-Host "candle exit: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $light -out dist/ObtainHub.msi dist/ObtainHub.wixobj 2>&1
          Write-Host "light exit: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "MSI: $(Get-Item dist/ObtainHub.msi)"

      - name: WiX ICE validation
        if: hashFiles('dist/ObtainHub.msi') != ''
        shell: powershell
        run: |
          $light = (Get-ChildItem "C:\Program Files*\WiX Toolset*\bin\light.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $light) { $light = (Get-Command light.exe -ErrorAction SilentlyContinue).Source }
          if (-not $light) { Write-Host "light.exe not found, skipping ICE"; exit 0 }
          & $light -sice:ICE60 -out NUL dist/ObtainHub.msi 2>&1 | Select-String -Pattern "ICE60|error|warning" | Select-Object -First 40
          Write-Host "ICE60 check done (exit $LASTEXITCODE)"

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          $isccFiles = Get-ChildItem "C:\ProgramData\chocolatey\lib\innosetup" -Recurse -Filter "ISCC.exe" -ErrorAction SilentlyContinue
          if ($isccFiles) { 
            $isccPath = $isccFiles[0].FullName
            Write-Host "Found ISCC in chocolatey: $isccPath"
          } else {
            Write-Host "NOT found in chocolatey lib, checking common paths..."
            Get-ChildItem "C:\ProgramData\chocolatey\lib" -Directory | ForEach-Object {
              $files = Get-ChildItem $_.FullName -Recurse -Filter "ISCC.exe" -ErrorAction SilentlyContinue
              if ($files) { Write-Host "Found ISCC at: $($files[0].FullName)" }
            }
            $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $isccPath)) {
              $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
            }
          }
          Add-Content -Path $env:GITHUB_ENV -Value "ISCC_PATH=$isccPath"
          Write-Host "ISCC_PATH set to: $isccPath"
          Write-Host "GITHUB_ENV content: $(Get-Content $env:GITHUB_ENV)"

      - name: Install Inno Setup and build EXE installer
        shell: powershell
        run: |
          Write-Host "GITHUB_ENV at step start: $(Get-Content $env:GITHUB_ENV)"
          $isccPath = $env:ISCC_PATH
          if (-not $isccPath -or -not (Test-Path $isccPath)) {
            Write-Host "ISCC NOT FOUND at '$isccPath'"
            Write-Host "Environment ISCC_PATH: $env:ISCC_PATH"
            exit 1
          }
          Write-Host "ISCC: $isccPath"
          & $isccPath installer/setup.iss 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Host "ISCC failed: $LASTEXITCODE"; exit $LASTEXITCODE }
          if (-not (Test-Path "installer/Output/ObtainHub-Setup.exe")) {
            Write-Host "Output/ObtainHub-Setup.exe NOT FOUND"
            exit 1
          }
          Write-Host "EXE installer: $(Get-Item installer/Output/ObtainHub-Setup.exe)"

      - name: Stage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            dist/ObtainHub.msi
            installer/Output/ObtainHub-Setup.exe
          if-no-files-found: error
          retention-days: 5

      - name: Generate SBOM (CycloneDX)
        run: |
          python -m cyclonedx_python_lib -o dist/ObtainHub-sbom.json --format JSON
        if: hashFiles('dist/ohub/ohub.exe') != ''

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/ObtainHub-sbom.json
          retention-days: 90

      - name: Code-sign release binaries
        continue-on-error: true
        env:
          SIGNING_PFX_B64: ${{ secrets.SIGNING_PFX_B64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ACCOUNT_ENDPOINT: ${{ secrets.AZURE_ACCOUNT_ENDPOINT }}
          AZURE_CODE_SIGNING_PROFILE: ${{ secrets.AZURE_CODE_SIGNING_PROFILE }}
        shell: powershell
        run: .github/scripts/sign.ps1

  smoke-test:
    name: Post-Build Smoke Test
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: dist
      - name: Install MSI silently
        run: |
          if (-not (Test-Path dist/ObtainHub.msi)) { Write-Host "MSI not found"; exit 1 }
          $log = "$env:RUNNER_TEMP\msi.log"
          Start-Process msiexec.exe -ArgumentList "/i", "dist\ObtainHub.msi", "/qn", "/norestart", "/l*v", $log -Wait -NoNewWindow
          if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 50; exit 1 }
          if (-not (Test-Path "$env:ProgramFiles\ObtainHub\ohub.exe")) { Write-Host "ohub.exe not installed"; exit 1 }
          & "$env:ProgramFiles\ObtainHub\ohub.exe" --version
          if ($LASTEXITCODE -ne 0) { Write-Host "ohub --version failed"; exit 1 }
      - name: Uninstall MSI
        run: |
          Start-Process msiexec.exe -ArgumentList "/x", "dist\ObtainHub.msi", "/qn", "/norestart" -Wait -NoNewWindow
          if ($LASTEXITCODE -ne 0) { Write-Host "MSI uninstall exit $LASTEXITCODE"; exit 1 }
          if (Test-Path "$env:ProgramFiles\ObtainHub\ohub.exe") { Write-Host "MSI cleanup failed"; exit 1 }
      - name: Install EXE silently
        run: |
          if (-not (Test-Path dist/ObtainHub-Setup.exe)) { Write-Host "EXE not found"; exit 1 }
          $log = "$env:RUNNER_TEMP\iss.log"
          & dist/ObtainHub-Setup.exe /VERYSILENT /NORESTART /SUPPRESSMSGBOXES /LOG=$log
          if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 50; exit 1 }
          if (-not (Test-Path "$env:ProgramFiles\ObtainHub\ohub.exe")) { Write-Host "ohub.exe not installed"; exit 1 }
          & "$env:ProgramFiles\ObtainHub\ohub.exe" --version
          if ($LASTEXITCODE -ne 0) { Write-Host "ohub --version failed"; exit 1 }
      - name: Uninstall EXE
        run: |
          if (Test-Path "$env:ProgramFiles\ObtainHub\unins000.exe") {
            $log = "$env:RUNNER_TEMP\uninst.log"
            & "$env:ProgramFiles\ObtainHub\unins000.exe" /VERYSILENT /NORESTART /SUPPRESSMSGBOXES /LOG=$log
            if ($LASTEXITCODE -ne 0) { Write-Host "EXE uninstall exit $LASTEXITCODE"; exit 1 }
          }
          if (Test-Path "$env:ProgramFiles\ObtainHub\ohub.exe") { Write-Host "EXE cleanup failed"; exit 1 }

  provenance:
    name: SLSA Provenance
    needs: [build, smoke-test]
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: dist
      - name: Attest MSI
        if: ${{ hashFiles('dist/ObtainHub.msi') != '' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/ObtainHub.msi
      - name: Attest EXE
        if: ${{ hashFiles('dist/ObtainHub-Setup.exe') != '' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/ObtainHub-Setup.exe
      - name: Attest SBOM
        if: ${{ hashFiles('dist/ObtainHub-sbom.json') != '' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/ObtainHub-sbom.json

  release:
    name: Create/Update Release
    needs: [build, smoke-test, provenance]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: dist
      - name: Create or update release
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = Get-Content CHANGELOG.md -Raw
          $notes = $notes -replace '(?s)^## \[.*?\n', ''
          $notes = $notes -replace '(?s)^## \[.*', ''
          gh release create $tag --title "Release $tag" --notes "$notes" --generate-notes $(
            if ("$tag" -match -- "-") { "--prerelease" } else { "" }
          ) --yes --cleanup-tag
        shell: powershell
      - name: Upload all assets
        run: |
          foreach ($f in @("dist/ObtainHub.msi","dist/ObtainHub-Setup.exe","dist/ObtainHub-sbom.json")) {
            if (Test-Path $f) { gh release upload --clobber $tag $f }
            else { Write-Host "MISSING $f" }
          }
        shell: powershell
      - name: Sync release notes to CHANGELOG.md
        run: python .github/scripts/sync_release_notes.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
