name: Build and Release Windows Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          Write-Host "=== Installing WiX Toolset via Chocolatey ==="
          choco install wixtoolset -y
          Write-Host "=== Verifying WiX Installation ==="
          $wixPaths = @(
            "C:\Program Files (x86)\WiX Toolset v3.11\bin",
            "C:\Program Files\WiX Toolset v3.11\bin",
            "C:\Program Files (x86)\WiX Toolset v4.0\bin",
            "C:\Program Files\WiX Toolset v4.0\bin",
            "C:\Program Files (x86)\WiX Toolset*\bin",
            "C:\Program Files\WiX Toolset*\bin"
          )
          foreach ($path in $wixPaths) {
            $resolved = Get-ChildItem $path -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($resolved) {
              Write-Host "Found WiX at: $($resolved.FullName)"
              Get-ChildItem $resolved.FullName
            }
          }
          $candlePath = Get-Command candle.exe -ErrorAction SilentlyContinue
          if ($candlePath) {
            Write-Host "Found candle.exe in PATH: $candlePath"
          } else {
            Write-Host "candle.exe NOT in PATH"
          }
          # Also install Inno Setup
          choco install innosetup -y

      - name: Build with PyInstaller
        shell: powershell
        run: |
          python -m PyInstaller --onefile --name ohub --clean obtainhub/main.py
          Write-Host "PyInstaller completed"
          Get-ChildItem dist\

      - name: Find Inno Setup
        shell: powershell
        run: |
          Write-Host "=== Find Inno Setup Debug ==="
          $isccPath = Get-Command iscc -ErrorAction SilentlyContinue
          if ($isccPath) {
            Write-Host "Found iscc in PATH: $isccPath"
            $env:ISCC_PATH = $isccPath
            Write-Host "ISCC_PATH=$isccPath" >> $env:GITHUB_ENV
          } else {
            $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (Test-Path $isccPath) {
              Write-Host "Found at default x86 location: $isccPath"
              $env:ISCC_PATH = $isccPath
              Write-Host "ISCC_PATH=$isccPath" >> $env:GITHUB_ENV
            } else {
              $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
              if (Test-Path $isccPath) {
                Write-Host "Found at default x64 location: $isccPath"
                $env:ISCC_PATH = $isccPath
                Write-Host "ISCC_PATH=$isccPath" >> $env:GITHUB_ENV
              } else {
                Write-Host "ISCC NOT FOUND in any default location!"
                exit 1
              }
            }
          }
          Write-Host "GITHUB_ENV ISCC_PATH: $env:ISCC_PATH"

      - name: Build WiX MSI
        shell: powershell
        run: |
          Write-Host "=== WiX MSI Build Debug ==="
          $wixPaths = @(
            "C:\Program Files (x86)\WiX Toolset v3.11\bin",
            "C:\Program Files\WiX Toolset v3.11\bin",
            "C:\Program Files (x86)\WiX Toolset v4.0\bin",
            "C:\Program Files\WiX Toolset v4.0\bin",
            "C:\Program Files (x86)\WiX Toolset*\bin",
            "C:\Program Files\WiX Toolset*\bin"
          )
          $wixBin = $null
          foreach ($path in $wixPaths) {
            $resolved = Get-ChildItem $path -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($resolved -and (Test-Path (Join-Path $resolved.FullName "candle.exe"))) {
              $wixBin = $resolved.FullName
              Write-Host "Found WiX at: $wixBin"
              break
            }
          }
          if (-not $wixBin) {
            $candlePath = Get-Command candle.exe -ErrorAction SilentlyContinue
            if ($candlePath) {
              $wixBin = Split-Path $candlePath
              Write-Host "Found candle.exe at: $candlePath, using dir: $wixBin"
            }
          }
          if ($wixBin) {
            Write-Host "Using WiX bin: $wixBin"
            $candle = Join-Path $wixBin "candle.exe"
            $light = Join-Path $wixBin "light.exe"
            Write-Host "candle: $candle (exists: $(Test-Path $candle))"
            Write-Host "light: $light (exists: $(Test-Path $light))"
            Write-Host "setup.wxs: $(Test-Path installer\setup.wxs)"
            Write-Host "ohub.exe: $(Test-Path dist\ohub.exe)"
            Write-Host "Running candle..."
            & $candle -out dist/ObtainHub.wixobj installer/setup.wxs 2>&1
            Write-Host "candle exit code: $LASTEXITCODE"
            Write-Host "Running light..."
            & $light -out dist/ObtainHub.msi dist/ObtainHub.wixobj 2>&1
            Write-Host "light exit code: $LASTEXITCODE"
            Write-Host "MSI created: $(Test-Path dist/ObtainHub.msi)"
            Get-ChildItem dist/
          } else {
            Write-Host "WiX Toolset NOT FOUND anywhere on system - skipping MSI build"
            Get-ChildItem "C:\Program Files (x86)" -Filter "*WiX*" -ErrorAction SilentlyContinue
            Get-ChildItem "C:\Program Files" -Filter "*WiX*" -ErrorAction SilentlyContinue
            Get-ChildItem "C:\ProgramData\chocolatey\lib" -Filter "*wix*" -ErrorAction SilentlyContinue | ForEach-Object { Get-ChildItem $_.FullName -Recurse -Filter "candle.exe" -ErrorAction SilentlyContinue }
          }
          exit 0

      - name: Build Inno Setup EXE
        shell: powershell
        working-directory: installer
        run: |
          Write-Host "=== Inno Setup Build Debug ==="
          Write-Host "Current directory: $(Get-Location)"
          Write-Host "ISCC_PATH from env: $env:ISCC_PATH"
          
          if (-not $env:ISCC_PATH) {
            Write-Host "ISCC_PATH not set in env, searching..."
            $isccPath = Get-Command iscc -ErrorAction SilentlyContinue
            if ($isccPath) {
              Write-Host "Found iscc in PATH: $isccPath"
              $env:ISCC_PATH = $isccPath
            } else {
              $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
              if (Test-Path $isccPath) {
                Write-Host "Found at default x86 location: $isccPath"
                $env:ISCC_PATH = $isccPath
              } else {
                $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
                if (Test-Path $isccPath) {
                  Write-Host "Found at default x64 location: $isccPath"
                  $env:ISCC_PATH = $isccPath
                } else {
                  Write-Host "ISCC NOT FOUND in any default location!"
                  exit 1
                }
              }
            }
          }
          
          Write-Host "ISCC_PATH resolved to: $env:ISCC_PATH"
          Write-Host "ISCC exists: $(Test-Path $env:ISCC_PATH)"
          
          $ohubPath = "..\dist\ohub.exe"
          Write-Host "Looking for ohub.exe at: $ohubPath"
          if (Test-Path $ohubPath) {
            Write-Host "ohub.exe FOUND"
            Get-ChildItem ..\dist\
          } else {
            Write-Host "ohub.exe NOT FOUND"
            Get-ChildItem ..\ -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue
            exit 1
          }
          
          Write-Host "Running ISCC: $env:ISCC_PATH setup.iss"
          & $env:ISCC_PATH setup.iss
          $exitCode = $LASTEXITCODE
          Write-Host "ISCC exit code: $exitCode"
          if ($exitCode -ne 0) {
            Write-Host "Inno Setup FAILED with exit code $exitCode"
            exit $exitCode
          }
          
          if (Test-Path "Output\ObtainHub-Setup.exe") {
            Write-Host "Inno Setup output FOUND at: installer\Output\ObtainHub-Setup.exe"
            Get-ChildItem Output\
          } else {
            Write-Host "Inno Setup output NOT FOUND in installer\Output!"
            Get-ChildItem . -Recurse -Filter "*.exe" | Where-Object {$_.Name -like "*Setup*"}
            Get-ChildItem ..\dist -Filter "*.exe" -ErrorAction SilentlyContinue
            Get-ChildItem . -Recurse -Filter "*.exe"
            exit 1
          }
          exit 0

      - name: Copy Inno Setup output to root dist
        run: |
          cp installer/Output/ObtainHub-Setup.exe dist/ObtainHub-Setup.exe
          ls -la dist/

      - name: List dist directory
        run: ls -la dist/

      - name: Create/Update Release and Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=${{ github.ref_name }}
          echo "Tag: $tag"
          
          # Determine if prerelease
          if [[ "$tag" == *"-beta"* ]] || [[ "$tag" == *"-alpha"* ]] || [[ "$tag" == *"-rc"* ]]; then
            prerelease="true"
          else
            prerelease="false"
          fi
          echo "Prerelease: $prerelease"
          
          # Delete existing release if it exists
          existingRelease=$(gh release view $tag --json id --jq .id 2>/dev/null)
          if [ -n "$existingRelease" ]; then
            echo "Deleting existing release: $existingRelease"
            gh release delete $tag --yes --cleanup-tag
          fi
          
          # Create new release
          echo "Creating release..."
          releaseArgs=("release" "create" "$tag" "--title" "Release $tag" "--generate-notes")
          if [ "$prerelease" = "true" ]; then
            releaseArgs+=("--prerelease")
          fi
          result=$(gh "${releaseArgs[@]}" 2>&1)
          echo "Release create result: $result"
          
          # Upload assets - ONLY MSI and Setup EXE (no standalone ohub.exe)
          assets=(
            "dist/ObtainHub.msi"
            "dist/ObtainHub-Setup.exe"
          )
          
          for asset in "${assets[@]}"; do
            if [ -f "$asset" ]; then
              echo "Uploading $asset..."
              gh release upload "$tag" "$asset" --clobber
            else
              echo "Asset not found: $asset"
            fi
          done