name: Build and Release Windows Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          choco install innosetup wixtoolset -y

      - name: Build with PyInstaller
        shell: powershell
        run: |
          python -m PyInstaller --onefile --name ohub --clean obtainhub/main.py

      - name: Build WiX MSI
        shell: powershell
        run: |
          $candle = "C:\Program Files (x86)\WiX Toolset v3.11\bin\candle.exe"
          $light = "C:\Program Files (x86)\WiX Toolset v3.11\bin\light.exe"
          & $candle -out dist/ObtainHub.wixobj installer/setup.wxs
          & $light -out dist/ObtainHub.msi dist/ObtainHub.wixobj

      - name: Build Inno Setup EXE
        shell: powershell
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc installer/setup.iss

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          files: |
            dist/ohub.exe
            dist/ObtainHub.msi
            dist/ObtainHub-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}