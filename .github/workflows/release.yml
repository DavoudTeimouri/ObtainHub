name: Build and Release Windows Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  typecheck:
    name: Type Check (mypy)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy

      - name: Run mypy
        run: mypy obtainhub/ --ignore-missing-imports

  security-audit:
    name: Security Audit (pip-audit)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r requirements.txt --format json --output pip-audit-results.json

      - name: Upload pip-audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: pip-audit-results.json
          retention-days: 30

  build:
    name: Build Artifacts
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Sync version into installer/manifest files
        run: python tools/sync_versions.py

      - name: Build with PyInstaller (onedir) and harden PE headers
        run: |
          python build_dist.py --exe
          Write-Host "PyInstaller completed"
          Get-ChildItem dist\ohub\

      - name: Generate WiX payload from the onedir build
        run: |
          python tools/gen_wix_payload.py
          Select-String -Path installer\setup.wxs -Pattern 'GENERATED PAYLOAD' -Context 0,3

      - name: Debug: show generated setup.wxs
        run: |
          Write-Host "=== GENERATED SETUP.WXS ==="
          Get-Content installer/setup.wxs

      - name: Build WiX MSI
        shell: powershell
        run: |
          Write-Host "=== WiX MSI Build ==="
          $wixBin = $null
          $wixPaths = @(
            "C:\Program Files (x86)\WiX Toolset v3.11\bin",
            "C:\Program Files\WiX Toolset v3.11\bin",
            "C:\Program Files (x86)\WiX Toolset v4.0\bin",
            "C:\Program Files\WiX Toolset v4.0\bin",
            "C:\Program Files (x86)\WiX Toolset*\bin",
            "C:\Program Files\WiX Toolset*\bin"
          )
          foreach ($p in $wixPaths) {
            $resolved = Get-ChildItem $p -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($resolved -and (Test-Path (Join-Path $resolved.FullName "candle.exe"))) {
              $wixBin = $resolved.FullName
              Write-Host "Found WiX at: $wixBin"
              break
            }
          }
          if (-not $wixBin) {
            $candlePath = Get-Command candle.exe -ErrorAction SilentlyContinue
            if ($candlePath) { $wixBin = Split-Path $candlePath }
          }
          if (-not $wixBin) {
            Write-Host "WiX NOT FOUND - skipping MSI"
            exit 0
          }
          $candle = Join-Path $wixBin "candle.exe"
          $light = Join-Path $wixBin "light.exe"
          Write-Host "candle: $candle (exists: $(Test-Path $candle))"
          Write-Host "light:  $light  (exists: $(Test-Path $light))"
          Write-Host "ohub.exe: $(Test-Path dist\ohub\ohub.exe)"
          & $candle -out dist/ObtainHub.wixobj installer/setup.wxs 2>&1
          Write-Host "candle exit: $LASTEXITCODE"
          & $light -out dist/ObtainHub.msi dist/ObtainHub.wixobj 2>&1
          Write-Host "light exit: $LASTEXITCODE"
          Write-Host "MSI created: $(Test-Path dist/ObtainHub.msi)"

      - name: WiX ICE validation
        if: hashFiles('dist/ObtainHub.msi') != ''
        shell: powershell
        run: |
          $light = (Get-ChildItem "C:\Program Files*\WiX Toolset*\bin\light.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $light) { $light = (Get-Command light.exe -ErrorAction SilentlyContinue).Source }
          if (-not $light) { Write-Host "light.exe not found, skipping ICE"; exit 0 }
          & $light -sice:ICE60 -out NUL dist/ObtainHub.msi 2>&1 | Select-String -Pattern "ICE60|error|warning" | Select-Object -First 40
          Write-Host "ICE60 check done (exit $LASTEXITCODE)"

      - name: Install Inno Setup and build EXE
        shell: powershell
        working-directory: installer
        run: |
          choco install innosetup -y --verbose --limit-output --execution-timeout=300

          $isccPath = (Get-Command iscc -ErrorAction SilentlyContinue).Path
          if (-not $isccPath) {
            $isccFiles = Get-ChildItem "C:\ProgramData\chocolatey\lib\innosetup" -Recurse -Filter "ISCC.exe" -ErrorAction SilentlyContinue
            if ($isccFiles) { $isccPath = $isccFiles[0].FullName }
          }
          if (-not $isccPath) {
            foreach ($d in @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe")) {
              if (Test-Path $d) { $isccPath = $d; break }
            }
          }
          if (-not $isccPath) { Write-Host "ISCC NOT FOUND"; exit 1 }
          Write-Host "ISCC: $isccPath"

          if (-not (Test-Path "..\dist\ohub\ohub.exe")) { Write-Host "dist\ohub\ohub.exe NOT FOUND"; exit 1 }

          & $isccPath setup.iss 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Host "ISCC failed: $LASTEXITCODE"; exit $LASTEXITCODE }
          if (-not (Test-Path "Output\ObtainHub-Setup.exe")) { Write-Host "Output\ObtainHub-Setup.exe NOT FOUND"; exit 1 }
          Get-ChildItem Output\

      - name: Stage artifacts
        shell: powershell
        run: |
          Copy-Item "installer\Output\ObtainHub-Setup.exe" "dist\ObtainHub-Setup.exe" -Force
          Get-ChildItem dist\

      - name: Generate SBOM (CycloneDX)
        run: |
          python -m pip install cyclonedx-bom
          cyclonedx-py environment --output-format JSON --outfile dist/ObtainHub-sbom.json
          Get-Item dist/ObtainHub-sbom.json

      - name: Code-sign release binaries
        shell: powershell
        continue-on-error: true
        env:
          SIGNING_PFX_B64: ${{ secrets.SIGNING_PFX_B64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ACCOUNT_ENDPOINT: ${{ secrets.AZURE_ACCOUNT_ENDPOINT }}
          AZURE_CODE_SIGNING_PROFILE: ${{ secrets.AZURE_CODE_SIGNING_PROFILE }}
        run: pwsh .github/scripts/sign.ps1

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            dist/ObtainHub.msi
            dist/ObtainHub-Setup.exe
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/ObtainHub-sbom.json
          retention-days: 90

  smoke-test:
    name: Post-Build Smoke Test
    runs-on: windows-latest
    needs: build
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: installers
          path: dist/

      - name: MSI install / run / uninstall
        shell: powershell
        run: |
          if (-not (Test-Path dist/ObtainHub.msi)) { Write-Host "MSI absent, skip"; exit 0 }
          $log = "$env:RUNNER_TEMP\msi.log"
          Start-Process msiexec -ArgumentList "/i", "dist\ObtainHub.msi", "/qn", "/norestart", "/l*v", $log -Wait -NoNewWindow
          if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 50; exit 1 }
          $exe = "$env:ProgramFiles\ObtainHub\ohub.exe"
          if (-not (Test-Path $exe)) { Write-Host "ohub.exe missing after MSI install"; exit 1 }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { Write-Host "ohub --version failed"; exit 1 }
          Start-Process msiexec -ArgumentList "/x", "dist\ObtainHub.msi", "/qn", "/norestart" -Wait -NoNewWindow
          if ($LASTEXITCODE -ne 0) { Write-Host "MSI uninstall exit $LASTEXITCODE"; exit 1 }
          Write-Host "MSI smoke PASSED"

      - name: Inno Setup install / run / uninstall
        shell: powershell
        run: |
          if (-not (Test-Path dist/ObtainHub-Setup.exe)) { Write-Host "Setup EXE absent, skip"; exit 0 }
          $log = "$env:RUNNER_TEMP\iss.log"
          Start-Process "dist\ObtainHub-Setup.exe" -ArgumentList "/VERYSILENT","/NORESTART","/SUPPRESSMSGBOXES","/LOG=$log" -Wait -NoNewWindow
          if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 50; exit 1 }
          $exe = "$env:ProgramFiles\ObtainHub\ohub.exe"
          if (-not (Test-Path $exe)) { Write-Host "ohub.exe missing after Setup install"; exit 1 }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { Write-Host "ohub --version failed"; exit 1 }
          $unins = "$env:ProgramFiles\ObtainHub\unins000.exe"
          if (Test-Path $unins) {
            Start-Process $unins -ArgumentList "/VERYSILENT","/NORESTART","/SUPPRESSMSGBOXES" -Wait -NoNewWindow
          }
          Write-Host "Inno Setup smoke PASSED"

  provenance:
    name: SLSA Provenance
    runs-on: windows-latest
    needs: [build, smoke-test]
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: installers
          path: dist/

      - name: Attest MSI
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/ObtainHub.msi

      - name: Attest Setup EXE
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/ObtainHub-Setup.exe

  release:
    name: Create/Update Release
    runs-on: windows-latest
    needs: [build, smoke-test, provenance]
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: installers
          path: dist/

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: dist/

      - name: List dist
        shell: powershell
        run: Get-ChildItem dist\

      - name: Create/Update Release and Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $prerelease = $tag -match 'beta|alpha|rc'
          Write-Host "Tag: $tag  Prerelease: $prerelease"

          $existing = gh release view $tag --json id --jq .id 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            Write-Host "Replacing existing release $existing"
            gh release delete $tag --yes --cleanup-tag
          }

          $args = @("release","create",$tag,"--title","Release $tag","--generate-notes")
          if ($prerelease) { $args += "--prerelease" }
          gh @args 2>&1
          if ($LASTEXITCODE -ne 0) { exit 1 }

          foreach ($asset in @("dist/ObtainHub.msi","dist/ObtainHub-Setup.exe","dist/ObtainHub-sbom.json")) {
            if (Test-Path $asset) {
              gh release upload $tag $asset --clobber
            } else {
              Write-Host "MISSING $asset"
            }
          }

      - name: Sync CHANGELOG.md into release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: python .github/scripts/sync_release_notes.py
