name: Build and Release Windows Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          choco install innosetup wixtoolset -y

      - name: Build with PyInstaller
        shell: powershell
        run: |
          python -m PyInstaller --onefile --name ohub --clean obtainhub/main.py

      - name: Find WiX tools
        shell: powershell
        continue-on-error: true
        run: |
          $wixPath = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -Directory | Select-Object -First 1
          if ($wixPath) {
            $binPath = Join-Path $wixPath.FullName "bin"
            if (Test-Path $binPath) {
              echo "WIX_BIN=$binPath" >> $env:GITHUB_ENV
            }
          }

      - name: Find Inno Setup
        shell: powershell
        continue-on-error: true
        run: |
          $isccPath = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $isccPath) {
            $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $isccPath)) {
              $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
            }
          }
          if (Test-Path $isccPath) {
            echo "ISCC_PATH=$isccPath" >> $env:GITHUB_ENV
          }

      - name: Build WiX MSI
        shell: powershell
        continue-on-error: true
        run: |
          if ($env:WIX_BIN) {
            $candle = Join-Path $env:WIX_BIN "candle.exe"
            $light = Join-Path $env:WIX_BIN "light.exe"
            & $candle -out dist/ObtainHub.wixobj installer/setup.wxs
            & $light -out dist/ObtainHub.msi dist/ObtainHub.wixobj
          }

      - name: Build Inno Setup EXE
        shell: powershell
        continue-on-error: true
        working-directory: installer
        run: |
          if ($env:ISCC_PATH) {
            & $env:ISCC_PATH setup.iss
          }

      - name: List dist directory
        shell: powershell
        run: |
          Get-ChildItem dist\

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          files: |
            dist/ohub.exe
            dist/ObtainHub.msi
            installer/dist/ObtainHub-Setup.exe
          overwrite: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}