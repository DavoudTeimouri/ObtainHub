name: Build and Release Windows Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          choco install innosetup wixtoolset -y

      - name: Build with PyInstaller
        shell: powershell
        run: |
          python -m PyInstaller --onefile --name ohub --clean obtainhub/main.py
          Write-Host "=== PyInstaller Output ==="
          Get-ChildItem dist\
          Get-ChildItem dist\ -Recurse -Filter "*.exe"

      - name: Find WiX tools
        shell: powershell
        run: |
          $wixPath = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -Directory | Select-Object -First 1
          if ($wixPath) {
            $binPath = Join-Path $wixPath.FullName "bin"
            if (Test-Path $binPath) {
              echo "WIX_BIN=$binPath" >> $env:GITHUB_ENV
            }
          }

      - name: Find Inno Setup
        shell: powershell
        run: |
          Write-Host "=== Find Inno Setup Debug ==="
          $isccPath = Get-Command iscc -ErrorAction SilentlyContinue
          if ($isccPath) {
            Write-Host "Found iscc in PATH: $isccPath"
          } else {
            Write-Host "iscc not in PATH, checking default locations..."
            $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (Test-Path $isccPath) {
              Write-Host "Found at default x86 location: $isccPath"
            } else {
              $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
              if (Test-Path $isccPath) {
                Write-Host "Found at default x64 location: $isccPath"
              } else {
                Write-Host "ISCC NOT FOUND in any default location!"
                $isccPath = $null
              }
            }
          }
          if ($isccPath) {
            echo "ISCC_PATH=$isccPath" >> $env:GITHUB_ENV
            Write-Host "Set ISCC_PATH to: $isccPath"
          } else {
            Write-Host "ERROR: ISCC_PATH not set!"
            exit 1
          }

      - name: Build WiX MSI
        shell: powershell
        run: |
          if ($env:WIX_BIN) {
            $candle = Join-Path $env:WIX_BIN "candle.exe"
            $light = Join-Path $env:WIX_BIN "light.exe"
            & $candle -out dist/ObtainHub.wixobj installer/setup.wxs
            & $light -out dist/ObtainHub.msi dist/ObtainHub.wixobj
          }

      - name: Build Inno Setup EXE
        shell: powershell
        working-directory: installer
        run: |
          Write-Host "=== Inno Setup Build Debug ==="
          Write-Host "Current directory: $(Get-Location)"
          Write-Host "ISCC_PATH: $env:ISCC_PATH"
          
          # Check if ohub.exe exists
          $ohubPath = "..\dist\ohub.exe"
          Write-Host "Looking for ohub.exe at: $ohubPath"
          if (Test-Path $ohubPath) {
            Write-Host "ohub.exe FOUND"
            Get-ChildItem ..\dist\
          } else {
            Write-Host "ohub.exe NOT FOUND"
            Get-ChildItem ..\ -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue
            exit 1
          }
          
          # Check ISCC
          if (-not $env:ISCC_PATH) {
            Write-Host "ISCC_PATH not set, searching..."
            $isccPath = Get-Command iscc -ErrorAction SilentlyContinue
            if (-not $isccPath) {
              $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
              if (-not (Test-Path $isccPath)) {
                $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
              }
            }
            if (Test-Path $isccPath) {
              Write-Host "Found ISCC at: $isccPath"
              $env:ISCC_PATH = $isccPath
            } else {
              Write-Host "ISCC NOT FOUND!"
              exit 1
            }
          }
          
          Write-Host "ISCC_PATH resolved to: $env:ISCC_PATH"
          Write-Host "ISCC exists: $(Test-Path $env:ISCC_PATH)"
          Write-Host "Running ISCC: $env:ISCC_PATH setup.iss"
          try {
            $process = Start-Process -FilePath $env:ISCC_PATH -ArgumentList "setup.iss" -Wait -PassThru -RedirectStandardOutput "stdout.txt" -RedirectStandardError "stderr.txt"
            $exitCode = $process.ExitCode
            $stdout = Get-Content "stdout.txt" -Raw -ErrorAction SilentlyContinue
            $stderr = Get-Content "stderr.txt" -Raw -ErrorAction SilentlyContinue
            Write-Host "ISCC exit code: $exitCode"
            if ($stdout) { Write-Host "ISCC stdout: $stdout" }
            if ($stderr) { Write-Host "ISCC stderr: $stderr" }
            if ($exitCode -ne 0) {
              Write-Host "Inno Setup FAILED with exit code $exitCode"
              exit $exitCode
            }
          } catch {
            Write-Host "Exception running ISCC: $_"
            exit 1
          }
          
          # Verify output
          if (Test-Path "dist\ObtainHub-Setup.exe") {
            Write-Host "Inno Setup output FOUND at: installer\dist\ObtainHub-Setup.exe"
            Get-ChildItem dist\
          } else {
            Write-Host "Inno Setup output NOT FOUND in installer\dist!"
            Get-ChildItem . -Recurse -Filter "*.exe" | Where-Object {$_.Name -like "*Setup*"}
            Get-ChildItem ..\dist -Filter "*.exe" -ErrorAction SilentlyContinue
            Get-ChildItem . -Recurse -Filter "*.exe"
            exit 1
          }

      - name: Copy Inno Setup output to root dist
        shell: powershell
        run: |
          if (Test-Path "installer\dist\ObtainHub-Setup.exe") {
            Copy-Item "installer\dist\ObtainHub-Setup.exe" "dist\ObtainHub-Setup.exe" -Force
            Write-Host "Copied to dist\ObtainHub-Setup.exe"
          } elseif (Test-Path "dist\ObtainHub-Setup.exe") {
            Write-Host "Found at dist\ObtainHub-Setup.exe (already in root)"
          } else {
            Write-Host "Source not found: installer\dist\ObtainHub-Setup.exe"
            Get-ChildItem . -Recurse -Filter "*.exe" | Where-Object {$_.Name -like "*Setup*"}
          }

      - name: List dist directory
        shell: powershell
        run: |
          Get-ChildItem dist\

      - name: Create/Update Release and Upload Assets
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "${{ github.ref_name }}"
          $prerelease = $tag -match 'beta|alpha'
          
          Write-Host "Tag: $tag"
          Write-Host "Prerelease: $prerelease"
          
          # Check if release exists
          $existingRelease = gh release view $tag --json id --jq .id 2>$null
          if ($existingRelease) {
            Write-Host "Deleting existing release: $existingRelease"
            gh release delete $tag --yes --cleanup-tag
          }
          
          # Create new release
          Write-Host "Creating release..."
          $releaseArgs = @("release", "create", $tag, "--title", "Release $tag", "--generate-notes")
          if ($prerelease) { $releaseArgs += "--prerelease" }
          $result = gh $releaseArgs 2>&1
          Write-Host "Release create result: $result"
          
          # Upload assets - ONLY MSI and Setup EXE (no standalone ohub.exe)
          $assets = @(
            "dist/ObtainHub.msi",
            "dist/ObtainHub-Setup.exe"
          )
          
          foreach ($asset in $assets) {
            if (Test-Path $asset) {
              Write-Host "Uploading $asset..."
              gh release upload $tag $asset --clobber
            }
            else {
              Write-Host "Asset not found: $asset"
            }
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}